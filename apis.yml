aid: allstripes
name: AllStripes
description: >-
  AllStripes was a San Francisco healthcare technology company, founded in 2017 as RDMD by
  Nancy Yu and Onno Faber, that built a research platform dedicated to rare disease. It
  retrieved, digitized and de-identified patients' medical records into regulatory-ready
  real-world evidence for biopharma drug development, and paired that with a patient
  application through which families affected by conditions such as Batten disease, Hunter
  syndrome and sickle cell anemia could participate in treatment research from home. The
  company raised roughly $74M in venture funding, including a $50M Series B in August 2021
  led by Lux Capital with JAZZ Venture Partners, Spark Capital, Medidata, McKesson Ventures
  and Maveron. PicnicHealth acquired AllStripes on October 23, 2023 and folded the platform
  into its own; the AllStripes brand has since been retired, and allstripes.com and
  app.allstripes.com now issue blanket 301 redirects to picnichealth.com. AllStripes never
  published a public developer portal, REST/OpenAPI contract, SDK, or webhook surface, and
  no such surface survives the acquisition.
